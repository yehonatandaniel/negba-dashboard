<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Negba | תצוגת מכירות</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>body { background:#F8F9FA; padding: 24px 12px; }</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;
const Icon = ({ name, size = 15, className = '' }) => (
  <i data-lucide={name} style={{ width: size, height: size }} className={className}></i>
);

// MOCK — full lead records, shared by both the list view and the household card
const mockLeads = [
  {
    id: 'LEAD_2201', name: 'משפחת כהן', householdType: 'זוג עם ילדים', kidsAges: [4, 10],
    profileMatch: 'Core Community', readinessStage: 'מחפשים באופן פעיל',
    budgetRangeMillion: [3, 4], locations: ['רעננה', 'הוד השרון / כפר סבא'],
    tags: [
      { tag: 'חינוך יסודי', sourceType: 'inferred', evidence: 'ילד בגיל 10', salesAngle: 'בית הספר היסודי באזור נחשב טוב ובמרחק הליכה בטוחה' },
      { tag: 'חינוך גיל רך - גן', sourceType: 'inferred', evidence: 'ילד בגיל 4', salesAngle: 'יש גני ילדים איכותיים במרחק הליכה' },
      { tag: 'רגישות גבוהה לשקט', sourceType: 'stated', evidence: 'בחר/ה "רעש וחוסר שקט" כמה שהכי לא רוצה שיקרה סביב הבית', salesAngle: 'אפשר להתמקד בדירות בקומות גבוהות או עורפיות, רחוקות מרעש רחוב' },
      { tag: 'צורך באחסון', sourceType: 'stated', evidence: 'בחר/ה "חדרי אחסון / ציוד" כמרחב חשוב', salesAngle: 'בפרויקט יש מחסנים צמודים - שווה להדגיש כבר בפגישה הראשונה' },
    ],
    notesForMatching: 'משפחה עם 2 ילדים (4, 10), רגישות לשקט, צורך באחסון — מתאים לפרויקטים שקטים עם מחסנים ומרחבי ילדים',
  },
  {
    id: 'LEAD_2214', name: 'משפחת לוי', householdType: 'זוג עם ילדים', kidsAges: [15],
    profileMatch: 'Independent Urbanists', readinessStage: 'מתעניינים ומתחילים לבדוק',
    budgetRangeMillion: [4, 5], locations: ['רעננה'],
    tags: [
      { tag: 'תיכון', sourceType: 'inferred', evidence: 'ילד/ה בגיל 15', salesAngle: 'תיכון איכותי בסביבה, רלוונטי גם לטווח הארוך' },
      { tag: 'רגישות גבוהה לשקט', sourceType: 'stated', evidence: 'בחר/ה "שקט ופרטיות" כמה שהכי גורם להרגיש בבית', salesAngle: 'הבניין כולו מוגדר כשקט - שווה לפתוח איתו' },
    ],
    notesForMatching: 'משפחה עם נער בגיל תיכון, רגישות לשקט — מתאים לפרויקטים עם תיכון איכותי בסביבה',
  },
  {
    id: 'LEAD_2233', name: 'משפחת אזולאי', householdType: 'זוג עם ילדים', kidsAges: [8],
    profileMatch: 'Quiet Belongers', readinessStage: 'מחכים להזדמנות הנכונה',
    budgetRangeMillion: [2, 3], locations: ['רעננה', 'חדרה'],
    tags: [
      { tag: 'חינוך יסודי', sourceType: 'inferred', evidence: 'ילד בגיל 8', salesAngle: 'בית ספר יסודי במרחק הליכה בטוחה' },
      { tag: 'צורך באחסון', sourceType: 'stated', evidence: 'בחר/ה "חדרי אחסון / ציוד" כמרחב חשוב', salesAngle: 'יש מחסן צמוד לכל דירה בפרויקט' },
    ],
    notesForMatching: 'משפחה עם ילד יסודי, צורך באחסון, תקציב נמוך יותר — מתאים לפרויקטים חסכוניים יותר עם מחסן',
  },
];

const mockProject = {
  name: 'הגדוד העברי 24-26', location: 'רעננה', priceFromMillion: 3.3,
  attributes: [
    { key: 'quiet_building', label: 'בניין שקט לאורך כל הפרויקט', icon: 'volume-2', matchesLeadTags: ['רגישות גבוהה לשקט'] },
    { key: 'storage', label: 'מחסן צמוד לכל דירה', icon: 'package-check', matchesLeadTags: ['צורך באחסון'] },
    { key: 'elementary_school', label: 'בי"ס יסודי הדר בקרבת מקום', icon: 'school', matchesLeadTags: ['חינוך יסודי'] },
    { key: 'high_school', label: 'חט"ב ותיכון אמי"ת רננים', icon: 'school', matchesLeadTags: ['תיכון', 'חטיבת ביניים'] },
    { key: 'green_community', label: 'שכונה קהילתית וירוקה, מעורבת', icon: 'trees', matchesLeadTags: [] },
  ],
};

const projectMatchableTags = new Set(mockProject.attributes.flatMap(a => a.matchesLeadTags));

function computeMatch(lead, project) {
  const tagNames = lead.tags.map(t => t.tag);
  const matched = tagNames.filter(t => projectMatchableTags.has(t));
  const tagScore = tagNames.length > 0 ? matched.length / tagNames.length : 0;
  const budgetOk = lead.budgetRangeMillion[1] >= project.priceFromMillion;
  const finalScore = Math.round(tagScore * (budgetOk ? 1 : 0.5) * 100);
  return { matched, unmatched: tagNames.filter(t => !matched.includes(t)), budgetOk, finalScore };
}

function TagPill({ item }) {
  const [open, setOpen] = useState(false);
  const isStated = item.sourceType === 'stated';
  return (
    <div className="rounded-xl border border-gray-100 bg-white overflow-hidden">
      <button onClick={() => setOpen(!open)} className="w-full flex items-center justify-between gap-3 px-4 py-3 text-right">
        <div className="flex items-center gap-2 min-w-0">
          <span className={`flex-shrink-0 w-2 h-2 rounded-full ${isStated ? 'bg-[#2D6A4F]' : 'bg-[#F4A261]'}`}></span>
          <span className="font-semibold text-sm text-[#1B1B2F] truncate">{item.tag}</span>
          <span className={`flex-shrink-0 text-[11px] px-2 py-0.5 rounded-full font-medium ${isStated ? 'bg-[#EAF3E9] text-[#2D6A4F]' : 'bg-[#FDF1E4] text-[#B5702E]'}`}>
            {isStated ? 'נאמר' : 'מוערך'}
          </span>
        </div>
        <Icon name={open ? 'chevron-up' : 'chevron-down'} className="text-gray-400 flex-shrink-0" />
      </button>
      {open && (
        <div className="px-4 pb-4 pt-1 space-y-2 border-t border-gray-50">
          <div className="text-xs text-[#6B7280]"><span className="font-medium text-[#1B1B2F]">מבוסס על: </span>{item.evidence}</div>
          <div className="flex items-start gap-2 bg-[#F8F9FA] rounded-lg p-3">
            <Icon name="sparkles" className="text-[#74C69D] flex-shrink-0 mt-0.5" />
            <p className="text-sm text-[#1B1B2F] leading-relaxed">{item.salesAngle}</p>
          </div>
        </div>
      )}
    </div>
  );
}

function HouseholdCardView({ lead, onBack }) {
  return (
    <div className="max-w-xl w-full mx-auto space-y-3">
      <button onClick={onBack} className="flex items-center gap-1.5 text-sm text-[#6B7280] px-1">
        <Icon name="arrow-right" size={15} /> חזרה לרשימה
      </button>
      <div className="rounded-2xl shadow-sm border border-gray-100 bg-white p-6">
        <div className="flex items-start justify-between mb-5">
          <div>
            <h2 className="text-xl font-bold text-[#1B1B2F]">{lead.name}</h2>
            <div className="flex items-center gap-1.5 mt-1 text-sm text-[#6B7280]">
              <Icon name="users" size={14} />
              <span>{lead.householdType}</span>
              {lead.kidsAges?.length > 0 && <span>· ילדים בגילאי {lead.kidsAges.join(', ')}</span>}
            </div>
          </div>
          <span className="text-xs font-semibold uppercase tracking-wide px-3 py-1.5 rounded-full bg-[#EAF3E9] text-[#2D6A4F] whitespace-nowrap">{lead.profileMatch}</span>
        </div>
        <div className="grid grid-cols-3 gap-3 mb-6">
          <div className="rounded-xl bg-[#F8F9FA] p-3">
            <div className="flex items-center gap-1.5 text-[#6B7280] mb-1"><Icon name="wallet" size={13} /><span className="text-[11px] font-semibold uppercase tracking-wide">תקציב</span></div>
            <div className="text-sm font-bold text-[#1B1B2F]">{lead.budgetRangeMillion[0]}-{lead.budgetRangeMillion[1]}M</div>
          </div>
          <div className="rounded-xl bg-[#F8F9FA] p-3">
            <div className="flex items-center gap-1.5 text-[#6B7280] mb-1"><Icon name="clock" size={13} /><span className="text-[11px] font-semibold uppercase tracking-wide">מוכנות</span></div>
            <div className="text-sm font-bold text-[#1B1B2F]">{lead.readinessStage}</div>
          </div>
          <div className="rounded-xl bg-[#F8F9FA] p-3">
            <div className="flex items-center gap-1.5 text-[#6B7280] mb-1"><Icon name="map-pin" size={13} /><span className="text-[11px] font-semibold uppercase tracking-wide">אזורים</span></div>
            <div className="text-sm font-bold text-[#1B1B2F] truncate">{lead.locations[0]}</div>
          </div>
        </div>
        <div className="mb-5">
          <div className="flex items-center gap-1.5 mb-3">
            <Icon name="tag" size={14} className="text-[#6B7280]" />
            <h3 className="text-sm font-semibold uppercase tracking-wide text-[#6B7280]">תגיות עומק לשיחת מכירה</h3>
          </div>
          <div className="space-y-2">{lead.tags.map((item, i) => <TagPill key={i} item={item} />)}</div>
        </div>
        <div className="rounded-xl border border-dashed border-gray-200 p-3">
          <p className="text-[11px] font-semibold uppercase tracking-wide text-[#6B7280] mb-1">נשמר להתאמות עתידיות</p>
          <p className="text-xs text-[#6B7280] leading-relaxed">{lead.notesForMatching}</p>
        </div>
      </div>
    </div>
  );
}

function LeadListRow({ lead, onOpen }) {
  return (
    <button onClick={() => onOpen(lead.id)} className="w-full rounded-xl border border-gray-100 bg-white p-4 flex items-center justify-between text-right">
      <div>
        <div className="font-semibold text-sm text-[#1B1B2F]">{lead.name}</div>
        <div className="text-xs text-[#6B7280] mt-0.5">{lead.householdType} · {lead.tags.length} תגיות עומק</div>
      </div>
      <span className="text-xs font-semibold uppercase tracking-wide px-2.5 py-1 rounded-full bg-[#EAF3E9] text-[#2D6A4F]">{lead.profileMatch}</span>
    </button>
  );
}

function ScoreBar({ score }) {
  const color = score >= 70 ? '#2D6A4F' : score >= 40 ? '#F4A261' : '#E63946';
  return <div className="w-full h-1.5 rounded-full bg-gray-100 overflow-hidden"><div className="h-full rounded-full" style={{ width: `${score}%`, backgroundColor: color }}></div></div>;
}

function MatchRow({ lead, project, onOpen }) {
  const { matched, unmatched, budgetOk, finalScore } = computeMatch(lead, project);
  return (
    <button onClick={() => onOpen(lead.id)} className="w-full text-right rounded-xl border border-gray-100 bg-white p-4">
      <div className="flex items-center justify-between mb-2">
        <span className="font-semibold text-sm text-[#1B1B2F]">{lead.name}</span>
        <span className="text-lg font-bold" style={{ color: finalScore >= 70 ? '#2D6A4F' : finalScore >= 40 ? '#B5702E' : '#B02A34' }}>{finalScore}%</span>
      </div>
      <ScoreBar score={finalScore} />
      <div className="flex flex-wrap gap-1.5 mt-3">
        {matched.map(t => <span key={t} className="text-[11px] px-2 py-1 rounded-full bg-[#EAF3E9] text-[#2D6A4F] font-medium">{t}</span>)}
        {unmatched.map(t => <span key={t} className="text-[11px] px-2 py-1 rounded-full bg-gray-50 text-gray-400 font-medium">{t}</span>)}
      </div>
      <div className="flex items-center gap-1.5 mt-3 text-xs">
        <Icon name={budgetOk ? 'check-circle-2' : 'x-circle'} size={13} className={budgetOk ? 'text-[#2D6A4F]' : 'text-[#E63946]'} />
        <span className="text-[#6B7280]">{budgetOk ? `תואם תקציב (${lead.budgetRangeMillion[0]}-${lead.budgetRangeMillion[1]}M)` : `מתחת לטווח המחיר (${lead.budgetRangeMillion[0]}-${lead.budgetRangeMillion[1]}M)`}</span>
      </div>
    </button>
  );
}

function SalesFlow() {
  const [tab, setTab] = useState('leads');
  const [selectedLeadId, setSelectedLeadId] = useState(null);
  useEffect(() => { window.lucide && window.lucide.createIcons(); });

  const selectedLead = mockLeads.find(l => l.id === selectedLeadId);
  const ranked = [...mockLeads].sort((a, b) => computeMatch(b, mockProject).finalScore - computeMatch(a, mockProject).finalScore);

  if (selectedLead) {
    return <HouseholdCardView lead={selectedLead} onBack={() => setSelectedLeadId(null)} />;
  }

  return (
    <div className="max-w-xl w-full mx-auto space-y-4">
      <div className="flex gap-2 p-1 rounded-xl bg-[#F8F9FA] w-fit">
        <button onClick={() => setTab('leads')} className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm font-medium ${tab === 'leads' ? 'bg-white shadow-sm text-[#1B1B2F]' : 'text-[#6B7280]'}`}>
          <Icon name="list" size={14} /> רשימת לידים
        </button>
        <button onClick={() => setTab('project')} className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm font-medium ${tab === 'project' ? 'bg-white shadow-sm text-[#1B1B2F]' : 'text-[#6B7280]'}`}>
          <Icon name="map-pin" size={14} /> התאמת פרויקט
        </button>
      </div>

      {tab === 'leads' && (
        <div className="space-y-2">{mockLeads.map(lead => <LeadListRow key={lead.id} lead={lead} onOpen={setSelectedLeadId} />)}</div>
      )}

      {tab === 'project' && (
        <div className="space-y-4">
          <div className="rounded-2xl shadow-sm border border-gray-100 bg-white p-6">
            <h2 className="text-xl font-bold text-[#1B1B2F]">{mockProject.name}</h2>
            <div className="flex items-center gap-1.5 mt-1 mb-4 text-sm text-[#6B7280]">
              <Icon name="map-pin" size={14} /><span>{mockProject.location}</span><span>·</span><Icon name="wallet" size={14} /><span>מ-{mockProject.priceFromMillion}M</span>
            </div>
            <p className="text-xs font-semibold uppercase tracking-wide text-[#6B7280] mb-2">פרופיל פרויקט</p>
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
              {mockProject.attributes.map(attr => (
                <div key={attr.key} className="flex items-center gap-2 rounded-lg bg-[#F8F9FA] px-3 py-2">
                  <Icon name={attr.icon} size={15} className="text-[#2D6A4F] flex-shrink-0" />
                  <span className="text-xs text-[#1B1B2F]">{attr.label}</span>
                </div>
              ))}
            </div>
          </div>
          <div>
            <p className="text-xs font-semibold uppercase tracking-wide text-[#6B7280] mb-2 px-1">לידים מתאימים ({ranked.length})</p>
            <div className="space-y-2">{ranked.map(lead => <MatchRow key={lead.id} lead={lead} project={mockProject} onOpen={setSelectedLeadId} />)}</div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<SalesFlow />);
</script>
</body>
</html>
